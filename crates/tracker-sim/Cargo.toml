[package]
name = "tracker-sim"
version = "0.5.2"
edition = "2021"
license = "MIT"

# Simulator plugin for testing a tracker you operate (docs/tracker-sim-design.md). It
# does not depend on Drift itself: it speaks the plugin protocol over stdin/stdout.
[[bin]]
name = "tracker-sim"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
